# Translates `@supabase/supabase-js`'s request shape to `storage-api`'s own.
#
# The client always calls `${url}/storage/v1/...` (that is exactly the form
# R21 needs the public URL prefix to have), but `storage-api` mounts its
# routes at `/` (`/object/public/<bucket>/<path>`, `/bucket`, ...). nginx does
# the one-line prefix rewrite; Kong is the piece of the FULL Supabase stack
# and would bring configuration this repo does not need
# (architecture.md § Emulador de Storage, decisión 3).
server {
  listen 80;

  # nginx's own default is 1m — a 2 MB upload would die on a 413 that is
  # none of this app's own error codes. Set comfortably above the app's own
  # 4 MB cap (`constants/media.ts`) so OUR limit is always the one that bites.
  client_max_body_size 10m;

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
