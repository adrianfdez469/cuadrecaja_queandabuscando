# One origin, two Supabase-shaped APIs (F-028, architecture.md § Contratos ›
# docker/supabase-gateway.conf). `@supabase/supabase-js` and `@supabase/ssr`
# always call `${url}/storage/v1/...` or `${url}/auth/v1/...`, but
# `storage-api` mounts its routes at `/` and GoTrue at `/` too. nginx does the
# one-line prefix rewrite for each; Kong is the piece of the FULL Supabase
# stack and would bring configuration this repo does not need
# (architecture.md § Emulador de Storage, decisión 3; F-028 decisión 3).
#
# Renamed from `storage-gateway.conf`/`storage-gateway` (F-028, D4): it now
# serves Auth too, and the old name would lie. Anyone with the old container
# still running needs `docker compose up -d --remove-orphans` once, or the
# new gateway fails with "port is already allocated" (E16/R11 — the warning
# lives in `.agent/init.sh` and `.env.example`).
server {
  listen 80;

  # nginx's own default is 1m — a 2 MB upload would die on a 413 that is
  # none of this app's own error codes. Set comfortably above the app's own
  # 4 MB cap (`constants/media.ts`) so OUR limit is always the one that bites.
  client_max_body_size 10m;

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The trailing slash on `proxy_pass` is what STRIPS the `/auth/v1/` prefix:
  # `/auth/v1/health` reaches GoTrue as `/health`. Without it, it would arrive
  # as `/auth/v1/health` and 404 — the same 404 that blocked F-012 before this
  # feature, now from the inside (architecture.md § docker/supabase-gateway.conf).
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Default `proxy_redirect` rewrites a GoTrue `Location: http://auth:9999/…`
    # to `http://localhost:54321/auth/v1/…`, which is what makes the email
    # link's `/verify` work from outside the network. It does NOT touch the
    # 302 to `accounts.google.com` — that Location does not match `proxy_pass`.
  }

  # The email template GoTrue fetches over HTTP for the OTP body
  # (`GOTRUE_MAILER_TEMPLATES_*`). Served by THIS gateway, already on the same
  # network, so a fourth container is never needed just to serve one file
  # (architecture.md § Decisión). `alias` (not `root`): the location's own
  # name is not a path segment under the aliased directory.
  location /dev-mail/ {
    alias /etc/nginx/dev-mail/;
  }
}
