name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queandabuscando
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queandabuscando
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/queandabuscando
      # Dummy values: enough to satisfy validation, never used against anything real.
      # F-018: no server-side variable authenticates /api/internal/* anymore
      # (the corte limpio of the old global token) — env.ts no longer parses one.
      SSO_JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-check
      ADMIN_SESSION_SECRET: ci-only-admin-secret-long-enough-to-pass-check
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Harness prose matches its scripts
        run: npm run check:harness

      - name: Prisma schema is valid
        run: npx prisma validate

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - name: Seed is idempotent
        run: |
          npm run seed
          npm run seed

      - run: npm run build

      - name: Per-store theming still resolves through var()
        run: npm run check:theme

      - name: Client bundle is within budget
        run: npm run check:bundle

  visual:
    runs-on: ubuntu-latest
    # Aparte de `verify`, no dentro de `--full`: instalar Chromium añade
    # ~1-2 min y ~150 MB (cacheables) que no vale la pena pagar en el bucle
    # típico typecheck/lint/test que los agentes corren decenas de veces por
    # sesión (.agent/specs/propuestas/verificacion-visual-en-el-arnes.md, P2).
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queandabuscando
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/queandabuscando
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/queandabuscando
      SSO_JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-check
      ADMIN_SESSION_SECRET: ci-only-admin-secret-long-enough-to-pass-check
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      - run: npm run seed

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Visual verification (F-010 — carrito y checkout)
        run: bash .agent/verify.sh F-010 --visual

      # Siempre, pase o falle la etapa: no hay ventana headless que mirar en
      # vivo, así que esto es lo único que deja ver la corrida después.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-shots-F-010
          path: .agent/runs/F-010/shots/
          retention-days: 14

      # Traces de Playwright (uno por contexto): timeline navegable — DOM,
      # red, consola, una captura por acción — que se abre localmente con
      # `npx playwright show-trace <archivo>` tras descargar el artifact.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-traces-F-010
          path: .agent/runs/F-010/traces/
          retention-days: 14

  auth:
    runs-on: ubuntu-latest
    # F-028, decisión 7: aparte de `verify`, igual que `visual` — traer las
    # imágenes de Docker (`supabase/auth`, `axllent/mailpit`) y levantar seis
    # contenedores cuesta minutos que no vale la pena pagar en el bucle rápido
    # de typecheck/lint/test. `docker compose` (no un `services:` de esta
    # tabla) porque este job necesita EXACTAMENTE el mismo compose que un
    # desarrollador levanta en local — Postgres propio en 5433, el gateway
    # renombrado en 54321 — no una réplica distinta con otro puerto.
    needs: verify

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cero `secrets.` (criterio 9): las tres claves locales las acuña este
      # MISMO job, igual que en local — nada de un secreto guardado en el
      # repositorio de GitHub.
      - name: Write .env for the local emulators
        run: |
          cat >> .env <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@localhost:5433/queandabuscando"
          DIRECT_URL="postgresql://postgres:postgres@localhost:5433/queandabuscando"
          NEXT_PUBLIC_SUPABASE_URL="http://localhost:54321"
          SUPABASE_STORAGE_BUCKET="store-media"
          NEXT_PUBLIC_SITE_URL="http://localhost:3000"
          SSO_JWT_SECRET="ci-only-secret-that-is-long-enough-to-pass-check"
          ADMIN_SESSION_SECRET="ci-only-admin-secret-long-enough-to-pass-check"
          CRON_SECRET="ci-only-cron-secret-long-enough"
          EOF

      - name: Mint local dev keys (STORAGE_JWT_SECRET, anon key, service key)
        run: node scripts/storage-dev-keys.mjs --write

      - name: Start the Storage + Auth emulators
        # `--wait` cannot cover the whole file. `storage-bucket-init` is a
        # one-shot: it seeds the bucket and exits, and compose counts a service
        # that FINISHES as a failure of the wait — even on exit 0. It bites
        # intermittently, depending on whether the container is done before
        # compose starts watching, which is why this passed for weeks and then
        # failed twice in a row on a docs-only diff.
        #
        # So: bring everything up, then wait only on the services meant to STAY
        # up. The list is derived from the compose file itself, not written out
        # here, so a service added later is covered without touching this.
        run: |
          docker compose up -d
          docker compose up -d --wait --wait-timeout 180 \
            $(docker compose config --services | grep -vx storage-bucket-init)

      - name: The storage bucket was seeded
        # Asserted on its own, which the single `--wait` never really did: it
        # could not tell "the one-shot finished" from "the one-shot failed".
        # `docker wait` returns the container's own exit code.
        run: |
          code=$(docker wait queandabuscando-storage-bucket-init)
          if [ "$code" != "0" ]; then
            echo "storage-bucket-init exited with $code"
            docker compose logs storage-bucket-init
            exit 1
          fi

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      - run: npm run seed

      - name: Auth emulator smoke (criterios 1, 2, 3, 8)
        run: bash .agent/verify.sh F-028 --only smoke
